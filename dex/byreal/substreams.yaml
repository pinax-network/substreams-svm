specVersion: v0.1.0
package:
  name: byreal
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-svm
  description: Byreal CLMM swap events for Solana.
  image: ../../image.png

imports:
  solana_common: ../../../spkg/solana-common-v0.4.0.spkg

binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ../../target/wasm32-unknown-unknown/release/byreal.wasm

protobuf:
  files:
    - v1/dex/byreal.proto
  importPaths:
    - ../../proto

modules:
  - name: map_events
    kind: map
    inputs:
      - map: solana_common:blocks_without_votes
    blockFilter:
      module: solana_common:program_ids_without_votes
      query:
        string: "program:REALQqNEomY6cQGZJUGwywTBD2UmDT32rZcNnfxQ5N2"
    output:
      type: proto:byreal.v1.Events

network: solana
