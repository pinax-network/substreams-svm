specVersion: v0.1.0
package:
  name: obric-v2
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-svm
  description: Obric V2 swap events for Solana.
  image: ../../image.png

imports:
  solana_common: ../../../spkg/solana-common-v0.4.0.spkg

binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ../../target/wasm32-unknown-unknown/release/obric_v2.wasm

protobuf:
  files:
    - v1/dex/obric-v2.proto
  importPaths:
    - ../../proto

modules:
  - name: map_events
    kind: map
    inputs:
      - map: solana_common:blocks_without_votes
    blockFilter:
      module: solana_common:program_ids_without_votes
      query:
        string: "program:coUnmi3oBUtwtd9fU42p6jg75UmdnNMgBQMedGNYEAs"
    output:
      type: proto:obric.v2.v1.Events

network: solana
