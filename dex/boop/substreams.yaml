specVersion: v0.1.0
package:
  name: boop
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-svm
  description: Boop trade events for Solana.
  image: ../../image.png

imports:
  solana_common: ../../../spkg/solana-common-v0.4.0.spkg

binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ../../target/wasm32-unknown-unknown/release/boop.wasm

protobuf:
  files:
    - v1/dex/boop.proto
  importPaths:
    - ../../proto

modules:
  - name: map_events
    kind: map
    inputs:
      - map: solana_common:blocks_without_votes
    blockFilter:
      module: solana_common:program_ids_without_votes
      query:
        string: "program:boop8hVGQGqehUK2iVEMEnMrL5RbjywRzHKBmBE7ry4"
    output:
      type: proto:boop.v1.Events

network: solana
