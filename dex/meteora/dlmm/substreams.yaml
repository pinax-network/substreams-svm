specVersion: v0.1.0
package:
  name: meteora_dlmm
  version: v0.4.1
  url: https://github.com/pinax-network/substreams-solana
  description: Meteora DLMM swap events for Solana.
  image: ../../../image.png

imports:
  solana_common: https://github.com/streamingfast/substreams-foundational-modules/releases/download/substreams-v0.3.3/solana-common-v0.3.3.spkg

binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ../../../target/wasm32-unknown-unknown/release/meteora_dlmm.wasm

protobuf:
  files:
    - v1/dex/meteora-dlmm.proto
  importPaths:
    - ../../../proto

modules:
  - name: map_events
    kind: map
    inputs:
      - map: solana_common:blocks_without_votes
    blockFilter:
      module: solana_common:program_ids_without_votes
      query:
        string: "program:LBUZKhRxPF3XUpBCjp4YzTKgLccjZhTSDM9YuVaPwxo"
    output:
      type: proto:meteora.dlmm.v1.Events

network: solana
