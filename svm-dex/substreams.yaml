specVersion: v0.1.0
package:
  name: svm_dex
  version: v0.4.1
  url: https://github.com/pinax-network/substreams-svm
  description: Database-ready normalized DEX swaps for Solana.
  image: ../image.png

imports:
  # SQL Sink Substreams
  database_changes: ../spkg/substreams-sink-database-changes-v4.0.0.spkg
  sql: ../spkg/substreams-sink-sql-protodefs-v1.0.7.spkg

  dex_swaps: ../spkg/dex-swaps-v0.4.1.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/svm_dex.wasm

modules:
  - name: db_out
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - map: dex_swaps:map_events

    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

network: solana
