[package]
name = "svm-dex"
description = { workspace = true }
edition = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-solana = { workspace = true }
substreams-database-change = { workspace = true }
num_enum = "0.7.4"

proto = { path = "../proto" }
common = { path = "../common" }

# Reuse an already computed complete-block projection without the WASM handler.
dex-swaps = { path = "../dex-swaps", default-features = false }

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
serde_json = "1"
wasmi = { version = "=0.46.0", default-features = false, features = ["std"] }
