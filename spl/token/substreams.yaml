specVersion: v0.1.0
package:
  name: spl_token
  version: v0.3.0
  url: https://github.com/pinax-network/substreams-solana
  description: SPL Token
  image: ../../image.png

imports:
  solana_common: ../../spkg/solana-common-v0.4.0.spkg

binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ../../target/wasm32-unknown-unknown/release/spl_token.wasm

protobuf:
  files:
    - v1/spl/spl-token.proto
  importPaths:
    - ../../proto

modules:
  - name: map_events
    kind: map
    doc: SPL Token
    inputs:
      - map: solana_common:blocks_without_votes
    blockFilter:
      module: solana_common:program_ids_without_votes
      query:
        string: "program:TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA ||
                 program:TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb ||
                 program:Memo1UhkJRfHyvLMcVucJwxXeuD728EqVDDwQDxFMNo ||
                 program:MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr"
    output:
      type: proto:solana.spl.token.v1.Events

network: solana
