specVersion: v0.1.0
package:
  name: svm_transfers
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-svm
  description: SPL, SPL-2022 & Native token transfers for Solana blockchains.
  image: ../image.png

imports:
  # SQL Sink Substreams
  database_changes: ../spkg/substreams-sink-database-changes-v4.0.0.spkg
  sql: ../spkg/substreams-sink-sql-protodefs-v1.0.7.spkg

  # Substreams
  spl_token: ../spkg/spl-token-v0.4.0.spkg
  native_token: ../spkg/native-token-v0.3.1.spkg

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/svm_transfers.wasm

modules:
  - name: db_out
    kind: map
    inputs:
      - source: sf.substreams.v1.Clock
      - map: spl_token:map_events
      - map: native_token:map_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

network: solana
