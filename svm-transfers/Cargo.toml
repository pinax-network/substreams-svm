[package]
name = "svm-transfers"
description = { workspace = true }
edition = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-solana = { workspace = true }
substreams-database-change = { workspace = true }

proto = { path = "../proto" }
common = { path = "../common" }

# Used only by `native`; never linked into the WASM module.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spl-transfers = { path = "../spl/transfers" }
native-token = { path = "../native/system", default-features = false }

[dev-dependencies]
flate2 = "1"
spl-token-common = { path = "../spl/token-common" }
wasmi = { version = "=0.46.0", default-features = false, features = ["std"] }
sha2 = "0.10"
serde_json = "1"
