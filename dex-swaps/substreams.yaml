specVersion: v0.1.0
package:
  name: dex_swaps
  version: v0.4.0
  url: https://github.com/pinax-network/substreams-svm
  description: Normalized swap events across Solana DEX protocols.
  image: ../image.png

imports:
  solana_common: ../spkg/solana-common-v0.4.0.spkg

binaries:
  default:
    type: wasm/rust-v1+wasm-bindgen-shims
    file: ../target/wasm32-unknown-unknown/release/dex_swaps.wasm

protobuf:
  files:
    - v1/dex-swaps.proto
  importPaths:
    - ../proto

modules:
  - name: map_events
    kind: map
    inputs:
      # - source: sf.solana.type.v1.Block
      - map: solana_common:blocks_without_votes
    output:
      type: proto:dex.swaps.v1.Events

network: solana
