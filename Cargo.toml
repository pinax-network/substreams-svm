[workspace]
members = [
  # DatabaseChanges
  "svm-balances",
  "svm-dex",
  "dex-swaps",
  "dex-pools",
  "dex-swaps-pools",
  "svm-transfers",
  "svm-accounts",
  "svm-metadata",
  "svm-staking",
  "svm-nfts",

  # Tokens
  "spl/token-common",
  "spl/transfers",
  "spl/transfers-substreams",
  "spl/token",
  "spl/token-2022",
  "spl/token-swap",
  "spl/token-lending",
  "native/system",
  "native/stake",
  "native/vote",

  # DEXs
  "dex/pumpfun/bonding_curve",
  "dex/pumpfun/amm",
  "dex/jupiter/v4",
  "dex/jupiter/v6",
  "dex/raydium/amm-v4",
  "dex/raydium/clmm",
  "dex/raydium/cpmm",
  "dex/raydium/launchpad",
  "metaplex",
  "dex/bonk-swap",
  "dex/orca/whirlpool",
  "dex/moonshot",
  "dex/pancakeswap",
  "dex/lifinity",
  "dex/meteora/amm",
  "dex/meteora/daam",
  "dex/meteora/dlmm",
  "dex/phoenix",
  "dex/openbook",
  "dex/stabble",
  "dex/darklake",
  "dex/dumpfun",
  "dex/goonfi",
  "dex/heaven",
  "dex/plasma",
  "dex/saros",
  "dex/aldrin",
  "dex/boop",
  "dex/byreal",
  "dex/dflow",
  "dex/drift",
  "dex/obric-v2",
  "dex/obric-v3",
  "dex/okx-dex",
  "dex/sanctum",
  "dex/serum",
  "dex/solfi-v1",
  "dex/solfi-v2",

  # NFT Marketplaces
  "nft/magiceden/m2",
  "nft/magiceden/m3",
  "nft/tensor",

  # Staking
  "staking/marinade",

  # Common
  "proto",
  "common",
]
resolver = "2"

[workspace.package]
description = "Solana Substreams"
edition = "2021"
version = "0.0.0"
license = "Apache-2.0"

[workspace.dependencies]
bs58 = "0.5.1"
substreams = "0.8.0"
substreams-abis = "2.0.0"
substreams-solana = "0.16.0"
# Buffa-native Solana decoder API with current pool-creation layouts and typed
# accounts; no Substreams runtime in native consumers.
substreams-solana-idls = { git = "https://github.com/pinax-network/substreams-solana-idls", rev = "665035860128e892504c37e2bfa7b7b96063cd42" }
spl-token = "9.0.0"
# SDK-free error alias fix, pending upstream review.
substreams-solana-program-instructions = { git = "https://github.com/DenisCarriere/substreams-solana-program-instructions", rev = "10b5b8d402b350b015c8f15af6ff3cac2b44729c" }
substreams-database-change = "5.0.0"
buffa = { version = "0.9.2", default-features = false, features = ["std"] }
buffa-types = { version = "0.9.2", default-features = false, features = ["std"] }

[profile.release]
lto = true

# The test-only historical WASM oracle runs released binaries in an interpreter.
# Unoptimized, a mainnet block takes minutes; optimize only the interpreter.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
